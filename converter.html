    ],

const TC = {
  c: (x) => x,
  f: (x) => ((x - 32) * 5) / 9,
  k: (x) => x - 273.15,
  r: (x) => ((x - 491.67) * 5) / 9,
};
const FC = {
  c: (x) => x,
  f: (x) => (x * 9) / 5 + 32,
  k: (x) => x + 273.15,
  r: (x) => ((x + 273.15) * 9) / 5,
};
const DIG = "0123456789abcdefghijklmnopqrstuvwxyz";

const $ = (id) => document.getElementById(id);
const S = { cat: "length", from: "", to: "", prec: 6, khOn: false, kh: false, raw: "" };
const KH = "០១២៣៤៥៦៧៨៩";
const norm = (t) => String(t).replace(/[០-៩]/g, (d) => KH.indexOf(d));
const disp = (t) => (S.kh ? String(t).replace(/[0-9]/g, (d) => KH[d]) : String(t));
function syncMode() {
  $("fromVal").inputMode = S.cat === "base" || S.khOn ? "text" : "decimal";
  $("khBtn").classList.toggle("pri", S.khOn);
}
function saveState() {
  try {
    localStorage.setItem("cvState", JSON.stringify({ cat: S.cat, from: S.from, to: S.to, prec: S.prec, khOn: S.khOn }));
  } catch (_) {}
}
let hist = [];
try {
  hist = JSON.parse(localStorage.getItem("cvHist") || "[]");
} catch (_) {}
const saveHist = () => {
  try {
    localStorage.setItem("cvHist", JSON.stringify(hist.slice(0, 8)));
  } catch (_) {}
};

const unit = (k) => C[S.cat].u.find((x) => x[0] === k);
const BASEN = { b2: "BIN", b8: "OCT", b10: "DEC", b16: "HEX", b32: "B32" };
const symOf = (u) => BASEN[u[0]] || u[2];
const label = (u) => u[1] + " (" + symOf(u) + ")";

/* ---------------- Core maths ---------------- */
function parseNum(str) {
  const s = String(str).replace(/[,\s]/g, "");
  if (s === "") return null;
  return /^[+-]?(\d+\.?\d*|\.\d+)(e[+-]?\d+)?$/i.test(s) ? Number(s) : NaN;
}
function parseBase(str, b) {
  const s = String(str).replace(/\s/g, "").toLowerCase();
  if (s === "") return null;
  const neg = s[0] === "-", body = neg ? s.slice(1) : s;
  if (!body || [...body].some((ch) => DIG.indexOf(ch) < 0 || DIG.indexOf(ch) >= b)) return NaN;
  const n = parseInt(body, b);
  return Number.isSafeInteger(n) ? (neg ? -n : n) : NaN;
}
function conv(v, f, t) {
  if (S.cat === "temp") return FC[t](TC[f](v));
  if (S.cat === "base") return v;
  return (v * unit(f)[3]) / unit(t)[3];
}
function fmt(n, key) {
  if (S.cat === "base") return n.toString(unit(key)[3]).toUpperCase();
  if (!isFinite(n)) return "Error system";
  n = parseFloat(n.toPrecision(14));
  if (n === 0) return "0";
  const a = Math.abs(n);
  if (a >= 1e15 || a < 10 ** -S.prec) return n.toExponential(Math.min(S.prec, 6)).replace(/\.?0+e/, "e");
  return n.toLocaleString("en-US", { maximumFractionDigits: S.prec });
}
function readInput() {
  const raw = norm($("fromVal").value);
  return S.cat === "base" ? parseBase(raw, unit(S.from)[3]) : parseNum(raw);
}

/* ---------------- Render ---------------- */
function renderTabs() {
  $("tabs").innerHTML = "";
  Object.keys(C).forEach((k) => {
    const b = document.createElement("button");
    b.className = "cv-tab" + (k === S.cat ? " on" : "");
    b.innerHTML = '<i class="fa-solid fa-' + C[k].i + '"></i>' + C[k].l;
    b.onclick = () => setCat(k);
    $("tabs").appendChild(b);
  });
  const on = $("tabs").querySelector(".on");
  if (on && on.scrollIntoView) on.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
}
function fillSelects() {
  ["fromSel", "toSel"].forEach((id) => {
    $(id).innerHTML = C[S.cat].u.map((u) => '<option value="' + u[0] + '">' + label(u) + "</option>").join("");
  });
  $("fromSel").value = S.from;
  $("toSel").value = S.to;
}
function setCat(k, keep) {
  S.cat = k;
  const u = C[k].u;
  if (!keep) {
    S.from = u[0][0];
    S.to = (u[1] || u[0])[0];
    $("fromVal").value = "";
    if (k === "base") {
      S.from = "b10";
      S.to = "b2";
    }
  }
  syncMode();
  renderTabs();
  fillSelects();
  renderQuick();
  run();
  saveState();
}
function run(commit) {
  S.kh = S.khOn || /[០-៩]/.test($("fromVal").value);
  const v = readInput(), out = $("toVal");
  const U = unit(S.from), T = unit(S.to);
  $("fromSym").textContent = U[1];
  $("fromU").textContent = symOf(U);
  $("toU").textContent = symOf(T);
  let text = "";
  if (v === null) {
    S.raw = "";
    out.value = "";
    out.className = "cv-num";
    $("allGrid").innerHTML = '<div class="cv-empty">សូមបញ្ចូលលេខ ដើម្បីមើលលទ្ធផល</div>';
    $("rate").textContent = "";
    return;
  }
  if (isNaN(v)) {
    S.raw = "";
    out.value = "Error system";
    out.className = "cv-num err";
    $("allGrid").innerHTML = "";
    $("rate").textContent = "";
    return;
  }
  text = fmt(conv(v, S.from, S.to), S.to);
  S.raw = text === "Error system" ? "" : text;
  out.value = disp(text);
  out.className = "cv-num" + (text.length > 13 ? " sm" : "");
  if (text === "Error system") out.className = "cv-num err";
  $("rate").textContent =
    S.cat === "base"
      ? U[1] + " → " + T[1]
      : disp("1") + " " + U[2] + " = " + disp(fmt(conv(1, S.from, S.to), S.to)) + " " + T[2];
  $("allGrid").innerHTML = "";
  C[S.cat].u.forEach((x) => {
    const b = document.createElement("button");
    b.className = "cv-item" + (x[0] === S.to ? " on" : "");
    b.innerHTML = "<b></b><small></small>";
    b.children[0].textContent = disp(fmt(conv(v, S.from, x[0]), x[0]));
    b.children[1].textContent = x[1] + " (" + x[2] + ")";
    b.onclick = () => {
      S.to = x[0];
      $("toSel").value = x[0];
      run(true);
    };
    $("allGrid").appendChild(b);
  });
  if (commit && text !== "Error system") addHist(v, text);
}
function addHist(v, text) {
  const raw = $("fromVal").value.trim();
  const row = { c: S.cat, f: S.from, t: S.to, v: raw, r: text };
  if (hist[0] && hist[0].c === row.c && hist[0].f === row.f && hist[0].t === row.t && hist[0].v === row.v) return;
  hist.unshift(row);
  hist = hist.slice(0, 8);
  saveHist();
  renderHist();
}
function renderHist() {
  const box = $("hist");
  box.innerHTML = "";
  if (!hist.length) {
    box.innerHTML = '<div class="cv-empty">មិនទាន់មានប្រវត្តិ។</div>';
    return;
  }
  hist.forEach((h) => {
    if (!C[h.c]) return;
    const fu = C[h.c].u.find((x) => x[0] === h.f), tu = C[h.c].u.find((x) => x[0] === h.t);
    if (!fu || !tu) return;
    const d = document.createElement("div");
    d.className = "cv-row";
    d.innerHTML = '<i class="fa-solid fa-' + C[h.c].i + '"></i><span></span><b></b>';
    d.children[1].textContent = h.v + " " + fu[2] + " → " + tu[2];
    d.children[2].textContent = h.r + " " + tu[2];
    d.onclick = () => {
      S.cat = h.c;
      S.from = h.f;
      S.to = h.t;
      $("fromVal").value = h.v;
      setCat(h.c, true);
    };
    box.appendChild(d);
  });
}
function renderQuick() {
  const g = $("quick");
  g.innerHTML = "";
  C[S.cat].q.forEach(([val, f, t]) => {
    const save = [S.from, S.to];
    S.from = f;
    S.to = t;
    const v = S.cat === "base" ? parseBase(val, unit(f)[3]) : Number(val);
    const res = fmt(conv(v, f, t), t), fu = unit(f), tu = unit(t);
    S.from = save[0];
    S.to = save[1];
    const c = document.createElement("div");
    c.className = "cv-chip";
    c.innerHTML = "<div></div><div></div>";
    c.children[0].textContent = disp(val) + " " + fu[1];
    c.children[1].textContent = disp(res) + " " + tu[2];
    c.onclick = () => {
      S.from = f;
      S.to = t;
      $("fromVal").value = String(val);
      fillSelects();
      run(true);
    };
    g.appendChild(c);
  });
}
function toast(t) {
  const el = $("toast");
  el.textContent = t;
  el.classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => el.classList.remove("show"), 1800);
}

/* ---------------- Events ---------------- */
let timer;
$("fromVal").addEventListener("input", () => {
  run();
  clearTimeout(timer);
  timer = setTimeout(() => run(true), 1100);
});
$("fromVal").addEventListener("keydown", (e) => {
  if (e.key === "Enter") run(true);
});
$("fromSel").onchange = () => {
  S.from = $("fromSel").value;
  run(true);
};
$("toSel").onchange = () => {
  S.to = $("toSel").value;
  run(true);
};
$("prec").onchange = () => {
  S.prec = +$("prec").value;
  run();
  renderQuick();
};
$("swapBtn").onclick = () => {
  const o = $("toVal").value;
  [S.from, S.to] = [S.to, S.from];
  if (o && o !== "Error system") $("fromVal").value = o.replace(/,/g, "");
  fillSelects();
  run(true);
};
$("khBtn").onclick = () => {
  S.khOn = !S.khOn;
  syncMode();
  saveState();
  run();
  renderQuick();
};
$("clearBtn").onclick = () => {
  $("fromVal").value = "";
  run();
  $("fromVal").focus();
};
$("histClear").onclick = () => {
  hist = [];
  saveHist();
  renderHist();
};
$("copyBtn").onclick = async () => {
  const t = S.raw;
  if (!t) return toast("Error system");
  try {
    await navigator.clipboard.writeText(t.replace(/,/g, ""));
  } catch (_) {
    const x = $("toVal");
    x.select();
    document.execCommand && document.execCommand("copy");
  }
  toast("បានចម្លង៖ " + $("toVal").value);
};

/* ---------------- Init ---------------- */
try {
  const st = JSON.parse(localStorage.getItem("cvState") || "null");
  if (st && C[st.cat]) {
    S.prec = st.prec || 6;
    S.khOn = !!st.khOn;
    $("prec").value = String(S.prec);
    setCat(st.cat);
    S.from = unit(st.from) ? st.from : S.from;
    S.to = unit(st.to) ? st.to : S.to;
    fillSelects();
    run();
  } else setCat("length");
} catch (_) {
  setCat("length");
}
renderHist();

/* ---------------- Header menu (new) ---------------- */
function toggleNav() {
  document.body.classList.toggle("nav-open");
}
document.querySelectorAll(".main-nav a").forEach((a) =>
  a.addEventListener("click", () => document.body.classList.remove("nav-open")),
);
window.addEventListener("resize", () => {
  if (window.innerWidth > 760) document.body.classList.remove("nav-open");
});
