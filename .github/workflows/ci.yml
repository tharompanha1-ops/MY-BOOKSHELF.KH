name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Integrity & link checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run rebuild integrity tests
        run: python3 tests/test_rebuild.py

      - name: Check for broken internal links
        run: python3 tools/check_links.py
