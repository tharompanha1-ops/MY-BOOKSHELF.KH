<script>
// Footer reveal is handled by the shared assets/js/app.js

const colors = ["#16a34a", "#eab308", "#1349b7", "#d16550", "#2095b6", "#9333ea"];
let expressions = [];
let exprIdCounter = 0;
let focusedInput = null;

/* ---------------- Normalization & Pre-parsing Engine ---------------- */
function normalizeSymbols(expr) {
  if (!expr) return "";
  return expr
    .replace(/²/g, "^2").replace(/³/g, "^3").replace(/⁴/g, "^4").replace(/⁵/g, "^5")
    .replace(/⁶/g, "^6").replace(/⁷/g, "^7").replace(/⁸/g, "^8").replace(/⁹/g, "^9").replace(/⁰/g, "^0")
    .replace(/eˣ/g, "exp").replace(/10ˣ/g, "10^")
    .replace(/ⁿ√\(/g, "nthRoot(").replace(/∛\(/g, "cbrt(").replace(/√\(/g, "sqrt(")
    .replace(/logₓ\(/g, "logx(")
    .replace(/≤/g, "<=").replace(/≥/g, ">=").replace(/≠/g, "!=")
    .replace(/×/g, "*").replace(/÷/g, "/").replace(/−/g, "-");
}

function preprocessMath(expr) {
  if (!expr) return "";
  let str = normalizeSymbols(expr);
  str = str.replace(/π/g, "pi");

  const functions = [
    "sin", "cos", "tan", "asin", "acos", "atan", "sinh", "cosh", "tanh", "cot", "sec", "csc", "acot",
    "sqrt", "cbrt", "nthRoot", "abs", "floor", "ceil", "min", "max", "logx", "log", "ln", "exp",
    "gcd", "lcm", "combinations", "permutations",
  ];

  // Protect function names during pre-parsing
  const fnPlaceholders = [];
  functions.forEach((fn, idx) => {
    const placeholder = `__FN${idx}__`;
    const regex = new RegExp(`\\b${fn}\\b`, "g");
    str = str.replace(regex, (match) => {
      fnPlaceholders.push({ placeholder, original: fn });
      return placeholder;
    });
  });

  // Implicit multiplication regex transformations
  str = str.replace(/(\^[\d.a-zA-Z]+|\^[a-zA-Z]|\^\([^)]+\))\s*([xye]|pi|__FN\d+__|[a-zA-Z]|\()/g, "$1*$2");
  str = str.replace(/(\d+|pi)\s*([xy]|__FN\d+__|[a-zA-Z]|\()/g, "$1*$2");
  str = str.replace(/(\))\s*(\(|\d+|pi|[xy]|__FN\d+__|[a-zA-Z])/g, "$1*$2");
  str = str.replace(/([xy])\s*(\(|\d+|pi|[xy]|__FN\d+__)/g, "$1*$2");

  // Restore original function names
  fnPlaceholders.forEach(({ placeholder, original }) => {
    str = str.replace(new RegExp(placeholder, "g"), original);
  });

  return str;
}

function mkScope(deg) {
  const t = deg ? Math.PI / 180 : 1, it = deg ? 180 / Math.PI : 1;
  return {
    sin: (x) => Math.sin(x * t),
    cos: (x) => Math.cos(x * t),
    tan: (x) => Math.tan(x * t),
    cot: (x) => 1 / Math.tan(x * t),
    sec: (x) => 1 / Math.cos(x * t),
    csc: (x) => 1 / Math.sin(x * t),
    asin: (x) => Math.asin(x) * it,
    acos: (x) => Math.acos(x) * it,
    atan: (x) => Math.atan(x) * it,
    acot: (x) => (Math.PI / 2 - Math.atan(x)) * it,
    ln: Math.log,
    logx: (b, x) => Math.log(x) / Math.log(b),
    log: (x, b) => (b === undefined ? Math.log10(x) : Math.log(x) / Math.log(b)),
  };
}
const GS = mkScope(false);
let roots = [];

let view = { xmin: -10, xmax: 10, ymin: -10, ymax: 10 };
const defaultView = { xmin: -10, xmax: 10, ymin: -10, ymax: 10 };

const canvas = document.getElementById("graphCanvas");
const ctx = canvas.getContext("2d");

function setMode(mode) {
  document.body.classList.remove("mode-graph", "mode-expr");
  document.body.classList.add("mode-" + mode);
  document.getElementById("btnModeGraph").classList.toggle("active", mode === "graph");
  document.getElementById("btnModeExpr").classList.toggle("active", mode === "expr");
  setTimeout(resizeCanvas, 50);
}

function switchCat(paneId, btn) {
  document.querySelectorAll(".cat-btn").forEach((b) => b.classList.remove("active"));
  document.querySelectorAll(".cat-pane").forEach((p) => p.classList.remove("active"));
  btn.classList.add("active");
  document.getElementById(paneId).classList.add("active");
}

function addExpression(text = "") {
  const id = "e" + exprIdCounter++;
  const color = colors[expressions.length % colors.length];
  expressions.push({ id, text, plot: "", color, visible: true });
  renderExprList();
  return id;
}

function removeExpression(id) {
  expressions = expressions.filter((e) => e.id !== id);
  roots = [];
  renderExprList();
  drawGraph();
}

function renderExprList() {
  const list = document.getElementById("exprList");
  list.innerHTML = "";
  expressions.forEach((expr, idx) => {
    const row = document.createElement("div");
    row.className = "expr-row";
    row.dataset.id = expr.id;
    row.classList.toggle("dirty", expr.text.trim() !== (expr.plot || "").trim());
    row.classList.toggle("bad", !!expr.bad);

    const chip = document.createElement("div");
    chip.className = "expr-chip";
    chip.style.background = expr.color;
    chip.innerHTML = "f<sub>" + (idx + 1) + "</sub>";
    chip.onclick = () => cycleColor(expr.id);

    const input = document.createElement("input");
    input.className = "expr-input";
    input.placeholder = "y = f(x) ឬ កន្សោមស្មើគ្នា";
    input.value = expr.text;
    input.dataset.id = expr.id;
    input.autocomplete = "off";
    input.spellcheck = false;
    input.oninput = (e) => {
      expr.text = e.target.value;
      roots = [];
      row.classList.toggle("dirty", expr.text.trim() !== (expr.plot || "").trim());
      row.classList.remove("bad");
    };
    input.onfocus = () => {
      focusedInput = input;
      document.querySelectorAll(".expr-row").forEach((r) => r.classList.remove("focused"));
      row.classList.add("focused");
    };
    input.onkeydown = (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        plotFocused();
      }
    };

    const del = document.createElement("button");
    del.className = "expr-del";
    del.innerHTML = '<i class="fa-solid fa-xmark"></i>';
    del.onclick = () => removeExpression(expr.id);

    row.appendChild(chip);
    row.appendChild(input);
    row.appendChild(del);
    list.appendChild(row);
  });
  document.getElementById("exprCount").textContent = expressions.length;
}

function cycleColor(id) {
  const expr = expressions.find((e) => e.id === id);
  if (!expr) return;
  const idx = colors.indexOf(expr.color);
  expr.color = colors[(idx + 1) % colors.length];
  renderExprList();
  drawGraph();
  focusInputById(id);
}

function focusInputById(id) {
  const el = document.querySelector('.expr-input[data-id="' + id + '"]');
  if (el) el.focus();
}

function insertText(txt) {
  if (!focusedInput) {
    const id = addExpression("");
    focusInputById(id);
  }
  const input = focusedInput;
  if (!input) return;
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  const val = input.value;
  input.value = val.slice(0, start) + txt + val.slice(end);
  const cursor = start + txt.length;
  input.setSelectionRange(cursor, cursor);
  input.dispatchEvent(new Event("input"));
  input.focus();
}

function backspaceField() {
  const input = focusedInput;
  if (!input) return;
  const start = input.selectionStart ?? input.value.length;
  const end = input.selectionEnd ?? input.value.length;
  const val = input.value;
  if (start === end && start > 0) {
    input.value = val.slice(0, start - 1) + val.slice(end);
    input.setSelectionRange(start - 1, start - 1);
  } else {
    input.value = val.slice(0, start) + val.slice(end);
    input.setSelectionRange(start, start);
  }
  input.dispatchEvent(new Event("input"));
  input.focus();
}

function clearFocusedField() {
  const input = focusedInput;
  if (!input) return;
  input.value = "";
  input.dispatchEvent(new Event("input"));
  input.focus();
}

function resizeCanvas() {
  const rect = canvas.parentElement.getBoundingClientRect();
  canvas.width = rect.width * devicePixelRatio;
  canvas.height = rect.height * devicePixelRatio;
  canvas.style.width = rect.width + "px";
  canvas.style.height = rect.height + "px";
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  drawGraph();
}

function toPx(x, y, w, h) {
  const px = ((x - view.xmin) / (view.xmax - view.xmin)) * w;
  const py = h - ((y - view.ymin) / (view.ymax - view.ymin)) * h;
  return [px, py];
}

function niceStep(range, targetTicks) {
  const rough = range / targetTicks;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const norm = rough / mag;
  let step;
  if (norm < 1.5) step = 1;
  else if (norm < 3) step = 2;
  else if (norm < 7) step = 5;
  else step = 10;
  return step * mag;
}

function drawGraph() {
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  ctx.clearRect(0, 0, w, h);

  const xStep = niceStep(view.xmax - view.xmin, 10);
  const yStep = niceStep(view.ymax - view.ymin, 10);

  ctx.lineWidth = 1;
  ctx.strokeStyle = "#eef2f0";
  ctx.font = '11px "Kantumruy Pro", sans-serif';
  ctx.fillStyle = "#94a3b8";

  let xStart = Math.ceil(view.xmin / xStep) * xStep;
  for (let x = xStart; x <= view.xmax; x += xStep) {
    const [px] = toPx(x, 0, w, h);
    ctx.beginPath();
    ctx.moveTo(px, 0);
    ctx.lineTo(px, h);
    ctx.stroke();
    if (Math.abs(x) > xStep / 100) {
      const [, py0] = toPx(0, 0, w, h);
      ctx.fillText(formatNum(x), px + 4, Math.min(Math.max(py0 + 14, 12), h - 4));
    }
  }

  let yStart = Math.ceil(view.ymin / yStep) * yStep;
  for (let y = yStart; y <= view.ymax; y += yStep) {
    const [, py] = toPx(0, y, w, h);
    ctx.beginPath();
    ctx.moveTo(0, py);
    ctx.lineTo(w, py);
    ctx.stroke();
    if (Math.abs(y) > yStep / 100) {
      const [px0] = toPx(0, 0, w, h);
      ctx.fillText(formatNum(y), Math.min(Math.max(px0 + 4, 2), w - 24), py - 4);
    }
  }

  ctx.strokeStyle = "#3d4c64";
  ctx.lineWidth = 1.6;
  const [px0, py0] = toPx(0, 0, w, h);
  ctx.beginPath();
  ctx.moveTo(0, py0);
  ctx.lineTo(w, py0);
  ctx.moveTo(px0, 0);
  ctx.lineTo(px0, h);
  ctx.stroke();

  ctx.fillStyle = "#3d4c64";
  ctx.font = 'italic 13px "Kantumruy Pro", sans-serif';
  ctx.fillText("x", w - 16, py0 - 8);
  ctx.fillText("y", px0 + 8, 14);

  expressions.forEach((expr) => plotExpression(expr, w, h));
  drawRoots(w, h);
}

function formatNum(n) {
  const r = Math.round(n * 1000) / 1000;
  return r.toString();
}

/* ---------------- Enhanced Equation Parsing & Classification ---------------- */
function parseImplicitEq(text) {
  const eqMatch = text.match(/^(.*?)=(.*)$/);
  if (!eqMatch) return null;
  const lhsStr = preprocessMath(eqMatch[1].trim());
  const rhsStr = preprocessMath(eqMatch[2].trim());
  if (!lhsStr || !rhsStr) return null;
  try {
    const lhsCompiled = math.compile(lhsStr);
    const rhsCompiled = math.compile(rhsStr);
    return (x, y) => {
      GS.x = x;
      GS.y = y;
      try {
        const lVal = lhsCompiled.evaluate(GS);
        const rVal = rhsCompiled.evaluate(GS);
        if (typeof lVal !== "number" || typeof rVal !== "number") return NaN;
        return lVal - rVal;
      } catch (_) {
        return NaN;
      }
    };
  } catch (_) {
    return null;
  }
}

/* Marching Squares for Implicit Curves */
function plotImplicitCurve(evalFn, color, w, h) {
  const step = Math.max(2, Math.floor(w / 280));
  const cols = Math.ceil(w / step);
  const rows = Math.ceil(h / step);
  const grid = new Float32Array((cols + 1) * (rows + 1));

  for (let r = 0; r <= rows; r++) {
    const py = r * step;
    const y = view.ymax - (py / h) * (view.ymax - view.ymin);
    for (let c = 0; c <= cols; c++) {
      const px = c * step;
      const x = view.xmin + (px / w) * (view.xmax - view.xmin);
      grid[r * (cols + 1) + c] = evalFn(x, y);
    }
  }

  ctx.strokeStyle = color;
  ctx.lineWidth = 2.4;
  ctx.beginPath();

  const lerp = (v0, v1) => {
    if (v0 === v1 || isNaN(v0) || isNaN(v1)) return 0.5;
    const t = -v0 / (v1 - v0);
    return Math.max(0, Math.min(1, t));
  };

  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const idx0 = r * (cols + 1) + c;
      const idx1 = idx0 + 1;
      const idx3 = (r + 1) * (cols + 1) + c;
      const idx2 = idx3 + 1;

      const v0 = grid[idx0], v1 = grid[idx1], v2 = grid[idx2], v3 = grid[idx3];

      if (isNaN(v0) || isNaN(v1) || isNaN(v2) || isNaN(v3)) continue;

      const state = (v0 > 0 ? 1 : 0) | (v1 > 0 ? 2 : 0) | (v2 > 0 ? 4 : 0) | (v3 > 0 ? 8 : 0);

      if (state === 0 || state === 15) continue;

      const x0 = c * step, y0 = r * step;
      const x1 = (c + 1) * step, y1 = (r + 1) * step;

      const top = [x0 + step * lerp(v0, v1), y0];
      const right = [x1, y0 + step * lerp(v1, v2)];
      const bottom = [x0 + step * lerp(v3, v2), y1];
      const left = [x0, y0 + step * lerp(v0, v3)];

      const line = (pA, pB) => {
        ctx.moveTo(pA[0], pA[1]);
        ctx.lineTo(pB[0], pB[1]);
      };

      switch (state) {
        case 1: case 14: line(left, top); break;
        case 2: case 13: line(top, right); break;
        case 3: case 12: line(left, right); break;
        case 4: case 11: line(right, bottom); break;
        case 5: line(left, top); line(right, bottom); break;
        case 6: case 9: line(top, bottom); break;
        case 7: case 8: line(left, bottom); break;
        case 10: line(top, right); line(left, bottom); break;
      }
    }
  }
  ctx.stroke();
}

function plotExpression(expr, w, h) {
  const text = (expr.plot || "").trim();
  if (!text) return;
  if (plotIneq(expr, text, w, h)) return;

  // Check for x = f(y) equations
  const xm = text.match(/^\s*x\s*=\s*(.+)$/i);
  if (xm) {
    let compiledY;
    try {
      compiledY = math.compile(preprocessMath(xm[1]));
    } catch (_) {}

    if (compiledY) {
      ctx.strokeStyle = expr.color;
      ctx.lineWidth = 2.6;
      ctx.beginPath();
      let started = false;
      const samples = Math.floor(h * 1.5);
      let prevPx = null;

      for (let i = 0; i <= samples; i++) {
        const y = view.ymin + (view.ymax - view.ymin) * (i / samples);
        let x;
        try {
          GS.y = y;
          GS.x = 0;
          x = compiledY.evaluate(GS);
        } catch (_) {
          started = false;
          continue;
        }
        if (typeof x !== "number" || !isFinite(x)) {
          started = false;
          continue;
        }
        const [px, py] = toPx(x, y, w, h);
        if (prevPx !== null && Math.abs(px - prevPx) > w * 1.5) started = false;
        if (!started) {
          ctx.moveTo(px, py);
          started = true;
        } else {
          ctx.lineTo(px, py);
        }
        prevPx = px;
      }
      ctx.stroke();
      return;
    }
  }

  // Implicit equation handling
  if (text.includes("=") && !/^\s*y\s*=/i.test(text)) {
    const evalFn = parseImplicitEq(text);
    if (evalFn) {
      plotImplicitCurve(evalFn, expr.color, w, h);
      return;
    }
  }

  // Standard explicit function y = f(x)
  let rhs = text;
  const eqMatch = text.match(/^\s*y\s*=\s*(.+)$/i);
  if (eqMatch) rhs = eqMatch[1];

  let compiled;
  try {
    compiled = math.compile(preprocessMath(rhs));
  } catch (err) {
    return;
  }

  ctx.strokeStyle = expr.color;
  ctx.lineWidth = 2.6;
  ctx.beginPath();

  let started = false;
  const samples = Math.floor(w * 1.5);
  let prevY = null;
  let prevPy = null;

  for (let i = 0; i <= samples; i++) {
    const x = view.xmin + (view.xmax - view.xmin) * (i / samples);
    let y;
    try {
      GS.x = x;
      GS.y = 0;
      y = compiled.evaluate(GS);
    } catch (err) {
      started = false;
      continue;
    }
    if (typeof y !== "number" || !isFinite(y)) {
      started = false;
      continue;
    }
    const [px, py] = toPx(x, y, w, h);

    if (
      prevY !== null &&
      ((prevY > 0 && y < 0) || (prevY < 0 && y > 0)) &&
      Math.abs(y - prevY) > (view.ymax - view.ymin) * 0.8
    ) {
      started = false;
    } else if (prevPy !== null && Math.abs(py - prevPy) > h * 1.5) {
      started = false;
    }

    if (!started) {
      ctx.moveTo(px, py);
      started = true;
    } else {
      ctx.lineTo(px, py);
    }
    prevY = y;
    prevPy = py;
  }
  ctx.stroke();
}

let isDragging = false;
let dragStart = null;
let viewStart = null;

function panStart(x, y) {
  isDragging = true;
  dragStart = { x, y };
  viewStart = { ...view };
}
function panMove(x, y) {
  if (!isDragging) return;
  const w = canvas.width / devicePixelRatio;
  const h = canvas.height / devicePixelRatio;
  const dx = ((x - dragStart.x) / w) * (viewStart.xmax - viewStart.xmin);
  const dy = ((y - dragStart.y) / h) * (viewStart.ymax - viewStart.ymin);
  view.xmin = viewStart.xmin - dx;
  view.xmax = viewStart.xmax - dx;
  view.ymin = viewStart.ymin + dy;
  view.ymax = viewStart.ymax + dy;
  drawGraph();
}
function panEnd() {
  isDragging = false;
}

canvas.addEventListener("mousedown", (e) => panStart(e.clientX, e.clientY));
window.addEventListener("mousemove", (e) => panMove(e.clientX, e.clientY));
window.addEventListener("mouseup", panEnd);

canvas.addEventListener("touchstart", (e) => {
  const t = e.touches[0];
  panStart(t.clientX, t.clientY);
}, { passive: true });
canvas.addEventListener("touchmove", (e) => {
  const t = e.touches[0];
  panMove(t.clientX, t.clientY);
  e.preventDefault();
}, { passive: false });
canvas.addEventListener("touchend", panEnd);

canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  const factor = e.deltaY > 0 ? 1.1 : 0.9;
  zoomGraph(factor);
}, { passive: false });

function zoomGraph(factor) {
  const cx = (view.xmin + view.xmax) / 2;
  const cy = (view.ymin + view.ymax) / 2;
  const halfW = ((view.xmax - view.xmin) / 2) * factor;
  const halfH = ((view.ymax - view.ymin) / 2) * factor;
  view.xmin = cx - halfW;
  view.xmax = cx + halfW;
  view.ymin = cy - halfH;
  view.ymax = cy + halfH;
  drawGraph();
}

function resetView() {
  view = { ...defaultView };
  drawGraph();
}

window.addEventListener("resize", resizeCanvas);

function drawRoots(w, h) {
  roots.forEach((r) => {
    const [px, py] = toPx(r.x, 0, w, h);
    ctx.beginPath();
    ctx.arc(px, py, 6, 0, 7);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.lineWidth = 3;
    ctx.strokeStyle = r.color;
    ctx.stroke();
  });
}
function findRoots() {
  roots = [];
  const N = 1500;
  expressions.forEach((e) => {
    if (!e.plot || parseIneq(e.plot) || /^\s*x\s*=/i.test(e.plot)) return;
    const m = e.plot.trim().match(/^y\s*=\s*(.+)$/i);
    const rhs = m ? m[1] : e.plot.trim();
    if (!rhs) return;
    let c;
    try {
      c = math.compile(preprocessMath(rhs));
    } catch (_) {
      return;
    }
    const f = (x) => {
      GS.x = x;
      try {
        const v = c.evaluate(GS);
        return typeof v === "number" && isFinite(v) ? v : NaN;
      } catch (_) {
        return NaN;
      }
    };
    let px = view.xmin, py = f(px);
    for (let i = 1; i <= N; i++) {
      const x = view.xmin + ((view.xmax - view.xmin) * i) / N, y = f(x);
      if (!isNaN(py) && !isNaN(y) && py * y <= 0 && py !== y) {
        let a = px, b = x;
        for (let k = 0; k < 60; k++) {
          const mid = (a + b) / 2;
          if (f(a) * f(mid) <= 0) b = mid;
          else a = mid;
        }
        const r = (a + b) / 2;
        if (Math.abs(f(r)) < 1e-5 && !roots.some((q) => Math.abs(q.x - r) < 1e-6))
          roots.push({ x: r, color: e.color });
      }
      px = x;
      py = y;
    }
  });
  roots.sort((p, q) => p.x - q.x);
  const box = document.getElementById("rootsBox");
  box.innerHTML = roots.length
    ? "<b>ឫស f(x)=0</b><br>" +
      roots.slice(0, 14).map((r) => "x = " + parseFloat(r.x.toPrecision(8))).join("<br>")
    : "រកមិនឃើញឫសក្នុងចន្លោះនេះទេ";
  box.style.display = "block";
  drawGraph();
}

function parseIneq(text) {
  const m = text.match(/^(.*?)(<=|>=|≤|≥|<|>|!=|≠)(.*)$/);
  if (!m) return null;
  const l = m[1].trim(), op = m[2], r = m[3].trim();
  if (!l || !r) return null;
  return { l, op, r };
}

let calcDeg = true, lastAns = 0, calcHist = [];

function setAng(deg) {
  calcDeg = deg;
  document.getElementById("aDeg").classList.toggle("on", deg);
  document.getElementById("aRad").classList.toggle("on", !deg);
  calcEval(false);
}

cInp.addEventListener("input", () => calcEval(false));
cInp.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    e.preventDefault();
    calcEval(true);

});

function fmtRes(n) {
  if (typeof n !== "number" || !isFinite(n)) return "Error";
  if (Math.abs(n) < 1e-12) return "0";
  if (Math.abs(n) >= 1e10 || (Math.abs(n) < 1e-4 && Math.abs(n) > 0)) {
    return n.toExponential(6);
  }
  return parseFloat(n.toFixed(8)).toString();
}

function calcEval(commit) {
  const q = cInp.value.trim();
  if (!q) {
    cOut.textContent = "";
    return;
  }
  try {
    const sc = mkScope(calcDeg);
    sc.ans = lastAns;
    const processedQ = preprocessMath(q.replace(/×/g, "*").replace(/÷/g, "/").replace(/√/g, "sqrt"));
    const v = math.evaluate(processedQ, sc);
    const r = fmtRes(v);
    cOut.className = "";
    cOut.textContent = "= " + r;
    if (commit && typeof v === "number" && isFinite(v)) {
      lastAns = v;
      calcHist.unshift([q, r]);
      calcHist = calcHist.slice(0, 8);
      document.getElementById("calcHist").innerHTML = "";
      calcHist.forEach(([a, b]) => {
        const d = document.createElement("div");
        d.innerHTML = "<span></span><b></b>";
        d.children[0].textContent = a;
        d.children[1].textContent = "= " + b;
        d.onclick = () => {
          cInp.value = a;
          cOut.textContent = "";
        };
        document.getElementById("calcHist").appendChild(d);
      });
    }
  } catch (_) {
    cOut.className = "err";
    cOut.textContent = "Error system";
  }
}
function cIns(t) {
  cInp.value += t;
  calcEval(false);
  cInp.focus();
}

const fk = [
  ["sin", "cos", "tan", "ln", "log"],
  ["√", "^", "(", ")", "π"],
];
const nk = [
  ["7", "8", "9", "÷", "C"],
  ["4", "5", "6", "×", "<-"],
  ["1", "2", "3", "−", "ans"],
  ["0", ".", "=", "+", ""],
];

fk.forEach((row) => {

    b.onclick = () => cIns(k + "(");

nk.forEach((row) => {

    if (!k) return;
    const b = document.createElement("button");
    b.textContent = k;
    if (k >= "0" && k <= "9") b.className = "n";
    else if ("+−×÷".includes(k)) b.className = "o";
    else if (k === "=") b.className = "eq";
    else if (k === "C") b.className = "c";

    b.onclick = () => {
      if (k === "C") {
        cInp.value = "";
        cOut.textContent = "";

        calcEval(false);
      } else if (k === "=") {
        calcEval(true);
      } else if (k === "ans") {
        cIns("ans");
      } else {
        cIns(k);
      }
    };
    numBox.appendChild(b);
  });
});

function gMsg(m, ok) {
  const t = document.getElementById("gToast");
  t.textContent = m;
  t.style.background = ok ? "#16a34a" : "#d16550";
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2800);
}

function checkExpr(t) {
  t = t.trim();
  if (!t) return true;
  const q = parseIneq(t);
  if (q) return true;

  if (t.includes("=")) {
    const parts = t.split("=");
    if (parts.length === 2 && parts[0].trim() && parts[1].trim()) {
      return true;
    }
    return false;
  }

  try {
    const c = math.compile(preprocessMath(t));
    let ok = false;
    for (const x of [-10, -1, 0, 1, 10]) {
      GS.x = x;
      GS.y = x;
      try {
        const v = c.evaluate(GS);
        if (typeof v === "number" && isFinite(v)) {
          ok = true;
          break;
        }
      } catch (_) {}
    }
    return ok;
  } catch (_) {
    return false;
  }
}

function plotFocused() {
  if (!focusedInput) {
    const id = addExpression("");
    focusInputById(id);
  }
  const input = focusedInput;
  if (!input) return;
  const expr = expressions.find((e) => e.id === input.dataset.id);
  if (!expr) return;
  const val = input.value.trim();
  if (!val) {
    expr.plot = "";
    expr.bad = false;
    renderExprList();
    drawGraph();
    return;
  }
  if (checkExpr(val)) {
    expr.plot = val;
    expr.bad = false;
    renderExprList();
    drawGraph();
    if (window.innerWidth <= 860) setMode("graph");
  } else {
    expr.bad = true;
    renderExprList();
    gMsg("កន្សោមមិនត្រឹមត្រូវ!");
  }
}

function plotIneq(expr, text, w, h) {
  const q = parseIneq(text);
  if (!q) return false;
  const mk = (src) => {
    if (src === "x") return (x) => x;
    if (src === "y") return (x, y) => y;
    let c;
    try {
      c = math.compile(preprocessMath(src));
    } catch (_) {
      return null;
    }
    return (x, y) => {
      GS.x = x;
      GS.y = y;
      try {
        const v = c.evaluate(GS);
        return typeof v === "number" ? v : NaN;
      } catch (_) {
        return NaN;
      }
    };
  };
  const A = mk(q.l), B = mk(q.r);
  if (!A || !B) return true;
  const opNorm = normalizeSymbols(q.op);
  const test = {
    "<": (a, b) => a < b,
    "<=": (a, b) => a <= b,
    ">": (a, b) => a > b,
    ">=": (a, b) => a >= b,
    "!=": (a, b) => Math.abs(a - b) > 1e-9,
  }[opNorm];
  if (!test) return false;

  const S = Math.max(4, Math.ceil(Math.sqrt((w * h) / 22000)));
  ctx.save();
  ctx.fillStyle = expr.color;
  ctx.globalAlpha = 0.2;
  for (let py = 0; py < h; py += S)
    for (let px = 0; px < w; px += S) {
      const x = view.xmin + ((view.xmax - view.xmin) * (px + S / 2)) / w;
      const y = view.ymax - ((view.ymax - view.ymin) * (py + S / 2)) / h;
      const a = A(x, y), b = B(x, y);
      if (!isNaN(a) && !isNaN(b) && test(a, b)) ctx.fillRect(px, py, S, S);
    }
  ctx.restore();
  if (opNorm !== "!=") {
    const other = q.l === "y" || q.l === "x" ? q.r : q.r === "y" || q.r === "x" ? q.l : null;
    const axis = q.l === "y" || q.l === "x" ? q.l : q.r === "y" || q.r === "x" ? q.r : null;
    if (axis && other) {
      ctx.save();
      ctx.setLineDash(opNorm.length === 1 ? [9, 7] : []);
      plotExpression({ plot: axis + "=" + other, color: expr.color }, w, h);
      ctx.restore();
    }
  }
  return true;
}

async function shareGraph() {
  const list = expressions.filter((e) => e.plot);
  if (!list.length) {
    gMsg("សូមគូសក្រាហ្វិកជាមុនសិន");
    return;
  }
  const k = canvas.width / canvas.clientWidth || 1, bar = Math.round(54 * k);
  const out = document.createElement("canvas");
  out.width = canvas.width;
  out.height = canvas.height + bar;
  const c = out.getContext("2d");
  c.fillStyle = "#ffffff";
  c.fillRect(0, 0, out.width, out.height);
  c.drawImage(canvas, 0, 0);
  c.fillStyle = "#0f172a";
  c.fillRect(0, canvas.height, out.width, bar);
  c.textBaseline = "middle";
  const mid = canvas.height + bar / 2;
  c.font = "700 " + 15 * k + 'px "JetBrains Mono","Kantumruy Pro",monospace';
  c.textAlign = "right";
  c.fillStyle = "#f59e0b";
  c.fillText("MY BOOKSHELF", out.width - 16 * k, mid);
  const limit = out.width - c.measureText("MY BOOKSHELF").width - 40 * k;
  c.textAlign = "left";
  let x = 16 * k;
  for (const e of list) {
    const t = e.plot.length > 28 ? e.plot.slice(0, 27) + "…" : e.plot;
    const wd = c.measureText(t).width + 34 * k;
    if (x + wd > limit) break;
    c.fillStyle = e.color;
    c.beginPath();
    c.arc(x + 6 * k, mid, 6 * k, 0, 7);
    c.fill();
    c.fillStyle = "#e2e8f0";
    c.fillText(t, x + 18 * k, mid);
    x += wd;
  }
  const blob = await new Promise((r) => out.toBlob(r, "image/png"));
  const file = new File([blob], "graph.png", { type: "image/png" });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "ក្រាហ្វិក", text: "ក្រាហ្វិកពី MY BOOKSHELF" });
      return;
    }
  } catch (err) {
    if (err && err.name === "AbortError") return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "graph.png";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  gMsg("បានរក្សាទុករូបភាព graph.png", true);
}
